[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Simple-Workflow-Engine"
dynamic = ["version"]
description = 'Simple Workflow Engine'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Raj Kallam", email = "tallreddy@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
     "pyyaml>=6.0"
]

[project.urls]
Documentation = "https://github.com/Raj Kallam/-#readme"
Issues = "https://github.com/Raj Kallam/-/issues"
Source = "https://github.com/Raj Kallam/-"

[tool.hatch.version]
path = "src/simple-workflow/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/_ tests}"

[tool.coverage.run]
source_pkgs = ["simple-workflow", "tests"]
branch = true
parallel = true
omit = [
  "src/simple-workflow/__about__.py",
]

[tool.coverage.paths]
_ = ["src/simple-workflow", "*/-/src/_"]
tests = ["tests", "*/-/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

 [tool.hatch.build.targets.wheel]
 packages = ["src/simple-workflow"]