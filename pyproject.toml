[project]
name = "simple-workflow-engine"
description = "A minimal Python workflow engine"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.hatch.version]
path = "src/simple_workflow_engine/__about__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
dependencies = [
    "pyyaml>=6.0",
]

[tool.hatch.envs.test]
dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pytest-cov>=5.0",
    "pylint>=2.15",
]
[tool.hatch.envs.test.scripts]
run = "pytest --cov=simple_workflow_engine --cov-report=term-missing"
lint = "pylint src/simple_workflow_engine"